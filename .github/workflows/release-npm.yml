name: Stage npm release

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    if: github.repository_owner == 'API-Disk-Integrations'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify immutable release tag
        working-directory: packages/typescript
        run: test "npm-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build and test without lifecycle scripts
        working-directory: packages/typescript
        env:
          SOURCE_DATE_EPOCH: '1788572716'
        run: |
          test "$(npm --version)" = '11.19.0'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
          mkdir -p release-dist
          npm pack --ignore-scripts --pack-destination release-dist
          (cd release-dist && sha256sum -c ../release.sha256)
      - name: Stage through npm OIDC
        working-directory: packages/typescript
        run: npm stage publish release-dist/*.tgz --access public

# No NODE_AUTH_TOKEN or registry secret is permitted. This workflow is for an
# existing npm package after its owner-controlled 2FA first publish. Configure
# the exact repository, filename release-npm.yml, environment npm-release, and
# stage-only allowed action in npm Trusted Publishing before running it.
