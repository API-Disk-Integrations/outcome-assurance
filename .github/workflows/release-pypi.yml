name: Publish PyPI release

on:
  push:
    tags:
      - 'pypi-v*'

permissions:
  contents: read

jobs:
  build:
    if: github.repository_owner == 'API-Disk-Integrations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'
          cache: ''
      - name: Verify immutable release tag
        working-directory: packages/python
        run: test "pypi-v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$GITHUB_REF_NAME"
      - name: Build, inspect, and verify deterministic digests
        working-directory: packages/python
        env:
          SOURCE_DATE_EPOCH: '1788572716'
          PYTHONNOUSERSITE: '1'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-release.txt
          python -c "compile(open('src/outcome_assurance/__init__.py', encoding='utf-8').read(), '<public-sdk>', 'exec')"
          python -m build --no-isolation --sdist --wheel
          python -m twine check dist/*
          (cd dist && sha256sum -c ../release.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-release-dist
          path: packages/python/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 pin

# No PyPI username, password, or API token is permitted. Before first use, the
# owner must bind a pending Trusted Publisher to this exact organization/repo,
# filename release-pypi.yml, and protected environment pypi.
