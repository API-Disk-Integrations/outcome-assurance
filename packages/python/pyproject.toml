[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "outcome-assurance"
version = "1.0.0"
description = "Verify whether agents achieved requested business outcomes via pre/postconditions, policy checks, side-effect detection and regression tests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "API Disk Integrations" }]
keywords = ["api", "sdk", "outcome-assurance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[tool.hatch.build]
ignore-vcs = true

[project.urls]
Homepage = "https://outcomeassurance-api.com/"
Documentation = "https://outcomeassurance-api.com/#docs"
Pricing = "https://outcomeassurance-api.com/#pricing"
Privacy = "https://outcomeassurance-api.com/privacy"
Terms = "https://outcomeassurance-api.com/terms"
Source = "https://github.com/API-Disk-Integrations/outcome-assurance"
Issues = "https://github.com/API-Disk-Integrations/outcome-assurance/issues"
Changelog = "https://github.com/API-Disk-Integrations/outcome-assurance/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/outcome_assurance"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/outcome_assurance/__init__.py",
]
